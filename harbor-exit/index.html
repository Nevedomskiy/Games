<body>
  <div class="sea-decoration" aria-hidden="true"></div>
  <header class="topbar">
    <button class="icon-button map-button" id="levels" type="button" aria-label="Выбрать уровень"></button>
    <div class="level-heading"><small>ЛОДОЧКИ</small><h1>Уровень <span id="level-number">01</span><span class="sr-only"> / <span id="level-total">50</span></span></h1><span id="level-title" class="sr-only"></span></div>

      <button class="icon-button quick-action hint-button" id="hint" type="button" aria-label="Подсказка за просмотр видео" title="Подсказка за видео"><span id="hint-icon" aria-hidden="true"></span><span>Подсказка ▶</span></button>
      <button class="icon-button menu-button" id="menu" type="button" aria-label="Настройки" aria-expanded="false"></button>
    </div>
  </header>
  <main class="layout">
    <section class="game" aria-label="Игровая гавань">
      <div class="level-bar"><div class="counter"><span id="counter-icon" aria-hidden="true"></span><span><strong id="remaining-count">4</strong><span id="counter-total"> / 4</span></span></div><div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div><button class="priority-mission" id="priority-mission" type="button" hidden></button><span id="progress-caption" class="sr-only"></span></div>
      <div class="harbor-scroll" id="harbor-scroll" tabindex="0" role="region" aria-label="Гавань, прокрутка большого поля"><div id="harbor-stage" class="harbor-stage"><div class="harbor" id="harbor"><div id="harbor-art" class="harbor-art" aria-hidden="true"></div><div id="water" class="water"><svg id="route" viewBox="0 0 600 700" aria-hidden="true"></svg><div id="boats"></div><div id="splashes" aria-hidden="true"></div></div></div></div></div>
      <p id="board-note" class="board-note"></p>
      <div class="voyage-bar" id="voyage-bar" hidden><button id="plan-toggle" type="button" aria-pressed="false">Закончить рейс</button><span id="plan-count" aria-live="polite"></span><button id="launch-voyage" type="button" disabled>Отправить</button><button id="clear-voyage" type="button" aria-label="Очистить рейс" hidden>×</button></div>
      <p class="status" id="status" role="status" aria-live="polite">Нажми на лодочку со свободным путём</p>
      <div class="controls">
        <button class="control-button continue-button" id="continue-game" type="button" hidden>Продолжить игру →</button>
        <button class="control-button pilot-button" id="reward-voyage" type="button" hidden><span id="pilot-icon" aria-hidden="true"></span><span>Лоцман<small>3 лодки · видео</small></span></button>
      </div>
    </section>
  </main>
  <section id="settings-tray" class="settings-tray" aria-label="Настройки игры" hidden>

    <fieldset class="water-choices"><legend>Цвет воды</legend><div role="group" aria-label="Цвет воды"><button type="button" data-water-choice="original" aria-pressed="true"><i></i>По эпохе</button><button type="button" data-water-choice="teal" aria-pressed="false"><i></i>Морская бирюза</button><button type="button" data-water-choice="blue" aria-pressed="false"><i></i>Голубая лагуна</button><button type="button" data-water-choice="sage" aria-pressed="false"><i></i>Светлый нефрит</button></div></fieldset>
    <fieldset class="era-choices"><legend>Эпоха игры и гавани</legend><div id="era-choices"></div><p id="era-status" role="status"></p></fieldset>
